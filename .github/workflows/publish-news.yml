name: Publish EXIMUTC News
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: write
concurrency:
  group: eximutc-public-news
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build published news
        run: python automation/website_news/publisher.py
      - name: Validate public files
        run: |
          test -s docs/index.html
          test -s docs/sitemap.xml
          test -s docs/robots.txt
      - name: Save history and pages
        run: |
          git config user.name 'EXIMUTC automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs pipeline_state/website_news_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish EXIMUTC news'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify live article and publication freshness
        run: python automation/website_news/verify_production.py
